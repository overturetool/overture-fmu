name: Build and Test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional build version (e.g. 0.3.1 or v0.3.1); blank uses the POM version"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test release version selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Select build version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            version=$(python3 scripts/version.py --build-version "$REQUESTED_VERSION")
          else
            version=$(python3 scripts/version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mvn -B -ntp -pl fmu -am package \
            "-Drevision=$BUILD_VERSION" -Dchangelist= -Dsha1=

      - name: Upload versioned runtime JAR
        uses: actions/upload-artifact@v6
        with:
          name: vdmfmu-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: fmu/target/vdmfmu-${{ steps.version.outputs.version }}-jar-with-dependencies.jar
          if-no-files-found: error
          retention-days: 3

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ runner.os }}
          path: '**/target/surefire-reports/'
          retention-days: 3
