name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.3.1 or v0.3.1); blank selects next patch or a new major/minor at patch zero"
        required: false
        type: string
      release_automatically:
        description: "Publish automatically (leave unchecked to create a draft)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: overture-fmu-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require a branch
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: test "$REF_TYPE" = branch

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test release version selection
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Prepare release version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(python3 scripts/version.py --prepare --version "$REQUESTED_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then
            echo "::error::Release $RELEASE_TAG already exists"
            exit 1
          fi

      - name: Build and test release
        run: mvn -B -ntp -pl fmu -am package

      - name: Upload versioned runtime JAR
        uses: actions/upload-artifact@v6
        with:
          name: vdmfmu-${{ steps.version.outputs.version }}-Linux
          path: fmu/target/vdmfmu-${{ steps.version.outputs.version }}-jar-with-dependencies.jar
          if-no-files-found: error
          retention-days: 3

      - name: Commit release version and push tag
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "Release $RELEASE_TAG" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          fi
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="fmu/target/vdmfmu-$RELEASE_VERSION-jar-with-dependencies.jar"
          test -s "$asset"
          gh release create "$RELEASE_TAG" "$asset" \
            --verify-tag --draft --generate-notes --title "Overture FMU $RELEASE_TAG"

      - name: Publish release
        if: inputs.release_automatically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Remove failed draft and tag owned by this run
        if: ${{ failure() && steps.tag.outputs.sha != '' }}
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const ref = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
            if (ref.data.object.sha !== process.env.RELEASE_SHA) {
              core.setFailed(`Refusing to delete ${tag}: it no longer points at this run's commit`);
              return;
            }
            try {
              const release = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              if (!release.data.draft) {
                core.setFailed(`Refusing to delete published release ${tag}`);
                return;
              }
              await github.rest.repos.deleteRelease({...context.repo, release_id: release.data.id});
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.git.deleteRef({...context.repo, ref: `tags/${tag}`});

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 3
